<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure It Homework</title>
<meta name="description" content="Short hands-on maths and science tasks for CBSE Grades 6–8, from your NCERT book.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar no-print"><a class="brand" href="./">Measure It</a><span class="sp"></span><a class="muted2" href="teacher.html">Teachers</a></div>
  <main id="view" tabindex="-1"></main>
</div>
<div class="bar hide no-print" id="bar"><div class="in"><button class="btn2 ghost" id="back">Back</button><button class="btn2" id="next">Next</button></div></div>
<script src="assignments.js"></script>
<script src="api.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = id => { try { return JSON.parse(localStorage.getItem('mi2:' + id)) || {}; } catch { return {}; } };
const save = (id, st) => { try { localStorage.setItem('mi2:' + id, JSON.stringify(st)); } catch {} };
const view = $('#view'), bar = $('#bar');
// All questions on one page, top to bottom, in order. Nothing is hidden until an earlier one is answered.
const linear = a => ({ ...a, screens: [{ id: 'all', groups: a.screens, q: a.screens.flatMap(sc => sc.q) }] });
let A = null, C = null, S = null;   // assignment, case, state

async function route() {
  const qs = new URLSearchParams(location.search), id = location.hash.slice(1) || qs.get('a'), a = ASSIGNMENTS.find(x => x.id === id);
  if (!a) return list();
  A = linear(a); S = load(a.id);
  const cid = clientId();
  if (!S.set || S.cid !== cid) {
    bar.classList.add('hide'); view.innerHTML = '<div class="screen"><p class="line">Getting your numbers…</p></div>';
    try {
      const r = await (await fetch(API + '/api/set?cid=' + cid)).json();
      if (!r.set) throw new Error('no set');
      S = { set: r.set, cid, step: 0, ans: {}, locked: {}, runs: [] }; save(a.id, S);
    } catch {
      view.innerHTML = '<div class="screen"><h2>Could not connect</h2><p class="line">This task needs the internet to start.</p><p><button class="btn2" id="retry">Try again</button></p></div>';
      $('#retry').onclick = route; return;
    }
  }
  if (location.hash.slice(1) !== a.id && !qs.get('a')) return;
  S.ans = S.ans || {}; S.locked = S.locked || {}; S.step = S.step || 0; S.runs = S.runs || [];
  C = CASE(S.set);
  S.step = Math.min(S.step, A.screens.length + 1);
  task();
}
addEventListener('hashchange', route);

/* ---------- list ---------- */
function list() {
  A = null; bar.classList.add('hide'); document.title = 'Measure It Homework';
  view.innerHTML = `<div class="hero"><h1>Pick a task</h1><p>Hands-on maths and science from your NCERT book.</p></div>
    <div class="grid">${ASSIGNMENTS.map(a => {
      const st = load(a.id), card = st.card, total = linear(a).screens.length + 2, at = Math.min(st.step || 0, total - 1);
      const s = card ? `<span class="status ${card.level}">${esc(LEVEL_TEXT[card.level])}</span>` : st.set && at > 0 ? '<span class="status">In progress</span>' : '';
      return `<a class="tcard" href="#${a.id}"><span class="chip2">Grade ${a.grade} · ${a.subject}</span><h3>${esc(a.title)}</h3><div class="meta">${a.minutes} min ${s ? '· ' : ''}${s}</div></a>`;
    }).join('')}</div>`;
  scrollTo(0, 0);
}

/* ---------- task ---------- */
const stepsTotal = () => A.screens.length + 2;   // start, screens..., check
function task() {
  document.title = A.title;
  const n = S.step, total = stepsTotal();
  const pct = Math.round((Math.min(n, total - 1) / (total - 1)) * 100);
  let h = `<a class="back no-print" href="./">← All tasks</a>
    <div class="stepno">${n === 0 ? 'Start' : n === total - 1 ? 'Check' : 'Your answers'}</div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>`;
  if (n === 0) h += startScreen();
  else if (n < total - 1) h += questionScreen(A.screens[n - 1]);
  else h += checkScreen();
  view.innerHTML = h;
  wire(); scrollTo(0, 0); view.focus({ preventScroll: true });
  bar.classList.toggle('hide', n === total - 1 && !!S.card);
  $('#back').classList.toggle('hide', n === 0);
  $('#next').disabled = false;
  $('#next').textContent = n === 0 ? 'Start' : n === total - 1 ? 'Check my answers' : 'Done, review';
}

function startScreen() {
  const mats = A.materials.map(m => `<span class="chip2">${esc(fill(m, C))}</span>`).join('');
  return `<div class="screen"><span class="chip2">Grade ${A.grade} · ${A.subject} · ${A.minutes} min</span>
    <h2 style="margin-top:12px">${esc(A.title)}</h2>
    <p class="line">${esc(fill(A.hook, C))}</p>
    <p class="muted2">${esc(A.why)}</p>
    <div class="chips" aria-label="You need">${mats}</div>
    ${A.safety ? `<div class="safety">⚠ ${esc(A.safety)}</div>` : ''}
    <p class="muted2">Your set number is <b>${S.set}</b>. It picks your own numbers. <a href="book.html?a=${A.id}" target="_blank" rel="noopener">Textbook page ↗</a></p></div>`;
}

function questionScreen(sc) {
  return `<div class="screen">${labView()}${sc.groups.map((g, i) => `<div class="qn">Question ${i + 1}</div><h2>${esc(fill(g.title, C))}</h2>
    ${g.do ? `<div class="do">${esc(fill(g.do, C))}</div>` : ''}
    ${g.q.map(id => field(A.questions.find(x => x.id === id), false)).join('')}`).join('')}
    <div id="hints" aria-live="polite"></div></div>`;
}

function field(q, locked) {
  const v = S.ans[q.id], dis = locked ? 'disabled' : '', lab = esc(fill(q.label, C));
  if (q.type === 'number')
    return `<div class="fld"><label for="f_${q.id}">${lab}</label><div class="numrow2"><input id="f_${q.id}" data-q="${q.id}" type="number" step="any" inputmode="decimal" min="${q.min}" max="${q.max}" value="${esc(v ?? '')}" ${dis} autocomplete="off"><span class="u">${esc(q.unit || '')}</span></div><div class="err" id="e_${q.id}"></div></div>`;
  if (q.type === 'choice')
    return `<div class="fld"><span class="lab" id="l_${q.id}">${lab}</span><div class="opts2" role="radiogroup" aria-labelledby="l_${q.id}">${q.options.map(o => `<button type="button" class="opt" role="radio" aria-checked="${v === o}" data-q="${q.id}" data-o="${esc(o)}" ${dis}>${esc(o)}</button>`).join('')}</div><div class="err" id="e_${q.id}"></div></div>`;
  return `<div class="fld"><label for="f_${q.id}">${lab}</label><textarea class="txt" id="f_${q.id}" data-q="${q.id}" maxlength="${q.max || 160}" ${dis}>${esc(v ?? '')}</textarea><div class="count"><span id="c_${q.id}">${(v || '').length}</span>/${q.max || 160}</div><div class="err" id="e_${q.id}"></div></div>`;
}

function showHints() {
  const box = $('#hints'); if (!box || !A.hints) return;
  const a = Object.fromEntries(A.questions.map(q => [q.id, S.ans[q.id] === '' ? undefined : S.ans[q.id]]));
  let f = []; try { f = A.hints(a, C); } catch {}
  box.innerHTML = f.map(([t, m]) => `<div class="hint ${t}">${esc(m)}</div>`).join('');
}

function wire() {
  view.querySelectorAll('input[data-q]').forEach(el => el.addEventListener('input', () => {
    S.ans[el.dataset.q] = el.value === '' ? '' : Number(el.value); save(A.id, S); showHints();
  }));
  view.querySelectorAll('textarea[data-q]').forEach(el => el.addEventListener('input', () => {
    S.ans[el.dataset.q] = el.value; $('#c_' + el.dataset.q).textContent = el.value.length; save(A.id, S);
  }));
  view.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    S.ans[b.dataset.q] = b.dataset.o; save(A.id, S);
    view.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x => x.setAttribute('aria-checked', String(x === b)));
  }));
  wireLab();
  showHints();
  const re = $('#redo'); if (re) re.onclick = () => { delete S.card; delete S.result; save(A.id, S); task(); };
}

/* validate the current screen; returns true when it may advance */
function validate(sc) {
  let ok = true;
  for (const id of sc.q) {
    const q = A.questions.find(x => x.id === id), v = S.ans[id], e = $('#e_' + id);
    let msg = '';
    if (q.type === 'number') {
      if (v === '' || v == null || !Number.isFinite(v)) msg = 'Enter a number.';
      else if (v < q.min || v > q.max) msg = `Enter a number between ${q.min} and ${q.max}.`;
    } else if (q.type === 'choice') { if (!v) msg = 'Pick one.'; }
    else if (!v || v.trim().length < 8) msg = 'Write a short sentence.';
    if (e) e.textContent = msg;
    if (msg) ok = false;
  }
  if (!ok) { const first = view.querySelector('.err:not(:empty)'); if (first) first.scrollIntoView({ block: 'center' }); }
  return ok;
}

$('#next').onclick = () => {
  const total = stepsTotal();
  if (S.step === 0) { S.step = 1; save(A.id, S); return task(); }
  if (S.step === total - 1) return verify();
  const sc = A.screens[S.step - 1];
  if (!validate(sc)) return;
  if (sc.lock) sc.q.forEach(id => S.locked[id] = true);
  S.step++; save(A.id, S); task();
};
$('#back').onclick = () => { if (S.step > 0) { S.step--; save(A.id, S); task(); } };

/* a random id for this browser, used only to limit how many times one task can be re-checked in a day */
let memCid = '';
function clientId() {
  const make = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join('');
  try { let c = localStorage.getItem('mi2:cid'); if (!c) { c = make(); localStorage.setItem('mi2:cid', c); } return c; }
  catch { return memCid || (memCid = make()); }
}
/* ---------- the lab on top of the questions ---------- */
const LAB = {
  pendulum: {
    title: 'Pendulum lab',
    controls: () => `${slider('length', 'Length', 10, 100, 5, 25, 'cm')}${slider('mass', 'Mass', 50, 500, 50, 100, 'g')}<button class="btn2" id="labrun" type="button">Run</button>`,
    run: v => ({ length: v.length, mass: v.mass }),
    show: r => `<b>${r.time} s</b> for 10 swings at ${r.length} cm, ${r.mass} g`,
    row: r => [`${r.length} cm`, `${r.mass} g`, `${r.time} s`], head: ['Length', 'Mass', '10 swings'],
  },
  dissolve: {
    title: 'Salt lab',
    controls: () => `<label class="ctl">Water<select id="lab_glasses"><option value="0.5">Half a glass</option><option value="1">One glass</option><option value="2">Two glasses</option></select></label>
      ${slider('temp', 'Temperature', 20, 80, 10, 20, '°C')}
      <label class="ctl chk"><input type="checkbox" id="lab_stir"> Stir</label><button class="btn2" id="labrun" type="button">Add salt</button>`,
    run: v => ({ glasses: v.glasses, temp: v.temp, stir: v.stir }),
    show: r => `<b>${r.spoons} spoons</b> dissolved. The next spoon stays at the bottom.`,
    row: r => [({ 0.5: 'Half', 1: 'One', 2: 'Two' })[r.glasses] + ' glass', `${r.temp} °C${r.stir ? ', stirred' : ''}`, `${r.spoons} spoons`], head: ['Water', 'Conditions', 'Dissolved'],
  },
};
const slider = (id, label, min, max, step, val, unit) =>
  `<label class="ctl">${label} <output id="out_${id}">${val} ${unit}</output><input type="range" id="lab_${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></label>`;

function labView() {
  const k = A.lab && A.lab.kind;
  if (!k) return '';
  if (LAB[k]) {
    const L = LAB[k];
    return `<section class="labbox" aria-label="${L.title}"><h2>${L.title}</h2>
      <div class="labctl">${L.controls()}</div><div class="labout" id="labout" aria-live="polite">Press the button to get a reading.</div>
      <div id="labruns">${runsTable(L)}</div></section>`;
  }
  if (k === 'river') return `<section class="labbox" aria-label="River map"><h2>River map</h2>
      <svg id="rivermap" viewBox="0 30 100 40" role="img" aria-label="A winding river on a map"></svg>
      <div class="labctl">${slider('step', 'Divider step', 2, 10, 1, 10, 'km')}</div><div class="labout" id="labout" aria-live="polite"></div></section>`;
  if (k === 'fence') return `<section class="labbox" aria-label="Field sketch"><h2>Try a field</h2>
      <p class="muted2">You have <b>${C.P} m</b> of fence.</p>
      <div class="labctl"><label class="ctl">Length (m)<input type="number" id="lab_l" inputmode="decimal" min="0" step="any" value=""></label>
      <label class="ctl">Breadth (m)<input type="number" id="lab_b" inputmode="decimal" min="0" step="any" value=""></label></div>
      <svg id="fencesvg" viewBox="0 0 100 60" role="img" aria-label="The field drawn to scale"></svg><div class="labout" id="labout" aria-live="polite"></div></section>`;
  if (k === 'mixer') return `<section class="labbox" aria-label="Drink mixer"><h2>Drink mixer</h2>
      <p class="muted2">Reference: <b>${C.ra} spoons</b> of sugar in <b>${C.rc} cups</b>.</p>
      <div class="labctl">${slider('sugar', 'Sugar', 0, 60, 0.5, 0, 'spoons')}${slider('cups', 'Water', 1, 30, 1, 1, 'cups')}</div>
      <div class="glass" id="glass" aria-hidden="true"><i></i></div><div class="labout" id="labout" aria-live="polite"></div></section>`;
  return '';
}
function runsTable(L) {
  const runs = (S.runs || []).filter(r => r.task === A.id).slice(-6);
  if (!runs.length) return '';
  return `<table class="runs"><thead><tr>${L.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${runs.map(r => `<tr>${L.row(r).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function wireLab() {
  const k = A && A.lab && A.lab.kind; if (!k || !$('.labbox')) return;
  document.querySelectorAll('.labbox input[type=range]').forEach(el => {
    const upd = () => { const o = $('#out_' + el.id.slice(4)); if (o) o.textContent = el.value + ' ' + el.dataset.unit; };
    el.addEventListener('input', () => { upd(); drawLab(); }); upd();
  });
  document.querySelectorAll('.labbox input[type=number]').forEach(el => el.addEventListener('input', drawLab));
  const b = $('#labrun');
  if (b) b.onclick = async () => {
    const L = LAB[k], v = { length: +($('#lab_length') || {}).value, mass: +($('#lab_mass') || {}).value, glasses: +($('#lab_glasses') || {}).value, temp: +($('#lab_temp') || {}).value, stir: !!($('#lab_stir') || {}).checked };
    b.disabled = true; $('#labout').textContent = 'Running…';
    try {
      const res = await fetch(API + '/api/lab', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: A.id, cid: clientId(), inputs: L.run(v) }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'failed');
      S.runs.push({ task: A.id, ...j }); S.runs = S.runs.slice(-12); save(A.id, S);
      $('#labout').innerHTML = L.show(j); $('#labruns').innerHTML = runsTable(L);
    } catch (e) { $('#labout').textContent = String(e.message || 'Could not run. Try again.'); }
    b.disabled = false;
  };
  drawLab();
}
function drawLab() {
  const k = A.lab.kind, out = $('#labout');
  if (k === 'river') {
    const step = +$('#lab_step').value, pts = river(S.set), jp = walk(S.set, step);
    const p = a => a.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    $('#rivermap').innerHTML = `<rect x="0" y="30" width="100" height="40" fill="var(--chip)"/><polyline points="${p(pts.filter((_, i) => i % 4 === 0))}" fill="none" stroke="#2f7fd1" stroke-width="1.6"/>
      <polyline points="${p(jp)}" fill="none" stroke="var(--ink)" stroke-width=".5" stroke-dasharray="1.2 1"/>${jp.map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9" fill="var(--accent)"/>`).join('')}`;
    out.innerHTML = `${jp.length - 1} steps of ${step} km: length <b>${(jp.length - 1) * step} km</b>`;
  } else if (k === 'fence') {
    const l = +$('#lab_l').value, b = +$('#lab_b').value, s = 52 / Math.max(C.P / 2, 1);
    if (l > 0 && b > 0) {
      const w = Math.min(l * s, 96), h = Math.min(b * s, 56);
      $('#fencesvg').innerHTML = `<rect x="2" y="2" width="${w}" height="${h}" fill="var(--chip)" stroke="var(--accent)" stroke-width="1.2"/>`;
      const used = 2 * (l + b);
      out.innerHTML = `Fence used: <b>${+used.toFixed(2)} m</b> of ${C.P} m · Area: <b>${+(l * b).toFixed(2)} m²</b> ${Math.abs(used - C.P) < 0.005 ? '✓' : used > C.P ? '(too much fence)' : '(some fence left)'}`;
    } else { $('#fencesvg').innerHTML = ''; out.textContent = 'Type a length and a breadth.'; }
  } else if (k === 'mixer') {
    const sg = +$('#lab_sugar').value, cu = +$('#lab_cups').value, per = sg / cu, d = per - C.r;
    $('#glass').firstElementChild.style.opacity = String(Math.min(1, 0.15 + per / 6));
    out.innerHTML = `${sg} spoons in ${cu} cups: <b>${Math.abs(d) < 0.005 ? 'tastes the same' : d > 0 ? 'sweeter than the reference' : 'less sweet than the reference'}</b>`;
  }
}

/* ---------- check ---------- */
function checkScreen() {
  if (S.card && S.result) return resultView(S.result);
  const rows = A.questions.map(q => `<li><span>${esc(q.short)}</span><span class="fbk">${esc(S.ans[q.id] === '' || S.ans[q.id] == null ? '–' : S.ans[q.id])}${q.unit && S.ans[q.id] !== '' && S.ans[q.id] != null ? ' ' + esc(q.unit) : ''}</span></li>`).join('');
  return `<div class="screen"><h2>Ready to check?</h2>
    <p class="line">Your answers go to a checker. No name is sent.</p>
    <details class="ans"><summary>See my answers</summary><ul class="items">${rows}</ul></details>
    <div id="vmsg" aria-live="polite"></div></div>`;
}

async function verify() {
  const btn = $('#next'), msg = $('#vmsg');
  btn.disabled = true; btn.textContent = 'Checking…';
  if (msg) msg.innerHTML = '<div class="hint warn">Checking… this can take a few seconds.</div>';
  try {
    const answers = Object.fromEntries(A.questions.map(q => [q.id, S.ans[q.id] ?? '']));
    const res = await fetch(API + '/api/verify', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: A.id, set: S.set, cid: clientId(), answers }) });
    const j = await res.json();
    if (j.error) { if (msg) msg.innerHTML = `<div class="hint warn">${esc(j.error)}</div>`; }
    else if (j.status === 'incomplete') { if (msg) msg.innerHTML = `<div class="hint warn">Please answer: ${j.missing.map(esc).join(', ')}</div>`; }
    else { S.card = { code: j.code, level: j.level }; S.result = j; save(A.id, S); task(); return; }
  } catch (e) {
    if (msg) msg.innerHTML = '<div class="hint warn">Could not reach the checker. Your answers are saved. Try again later.</div>';
  }
  btn.disabled = false; btn.textContent = 'Check my answers';
}

function resultView(j) {
  const items = j.questions.map(q => `<li class="${q.level === 'got_it' ? 'ok' : 'no'}"><span class="tick">${q.level === 'got_it' ? '✓' : q.level === 'partly' ? '~' : '✗'}</span><span>${esc(q.label)}</span><span class="fbk">${q.level === 'got_it' ? '' : esc(q.feedback)}</span></li>`).join('');
  return `<div class="screen result"><div class="badge ${j.level}">${esc(LEVEL_TEXT[j.level])}</div>
    <p class="line">${j.level === 'got_it' ? 'Your answers hold together.' : j.level === 'partly' ? 'Close. Fix the marked ones and check again.' : 'Not yet. Look at the marked ones and try again.'}</p>
    <ul class="items">${items}</ul>
    <div class="codebox">${esc(j.code)}</div>
    <p class="muted2">Show this code to your teacher. They can check it.</p>
    <p style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <a class="btn2" style="text-decoration:none;display:inline-flex;align-items:center" href="card.html#${encodeURIComponent(j.code)}" target="_blank" rel="noopener">Open my card ↗</a>
      <button class="btn2 ghost" id="redo">Change answers</button></p></div>`;
}

route();
</script>
</body>
</html>
