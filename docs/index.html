<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure It Homework</title>
<meta name="description" content="Hands-on maths and science homework for CBSE Grades 6–8, built on NCERT activities.">
<link rel="stylesheet" href="style.css">
<style>
.phase{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.q{margin:12px 0}
.q textarea{width:100%;min-height:84px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.q .unit{color:var(--ink-3);font-size:14px;margin-left:6px}
.numrow{display:flex;align-items:center;gap:6px;max-width:260px}
.ai{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.ai p{margin:4px 0;color:var(--ink)}
.fb{margin:6px 0;padding:10px 12px;border-radius:10px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.warn{background:var(--warn-bg);color:var(--warn)} .fb.info{background:var(--chip);color:var(--ink-2)}
.sheet dt{font-weight:700;margin-top:10px} .sheet dd{margin:2px 0 0;white-space:pre-wrap}
.blank{border-bottom:1px solid #999;height:28px}
.checks label{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-weight:600;color:var(--ink)}
.checks input{width:auto}
.note{font-size:14px;color:var(--ink-2);background:var(--chip);border-radius:10px;padding:10px 14px}
</style>
</head>
<body>
<main>
  <div class="no-print">
    <h1><a href="./" style="color:inherit;text-decoration:none">Measure It Homework</a></h1>
    <p class="muted">Maths and science you do with your own hands, from your NCERT book. Grades 6–8.</p>
  </div>
  <div id="list"></div>
  <div id="one" class="hide"></div>
  <p class="muted no-print" style="margin-top:28px">For teachers: <a href="teacher.html">answer keys, rubrics and printable sheets</a> · <a href="checklist.html">How these were designed and tested</a></p>
</main>
<script src="assignments.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = id => { try { return JSON.parse(localStorage.getItem('mi:' + id)) || {}; } catch { return {}; } };
const save = (id, a) => { try { localStorage.setItem('mi:' + id, JSON.stringify(a)); } catch {} };
const PHASES = ['Predict', 'Do it', 'Record', 'Calculate', 'Explain', 'Teach it back'];

function route() {
  const q = new URLSearchParams(location.search), id = location.hash.slice(1) || q.get('a'), A = ASSIGNMENTS.find(x => x.id === id);
  if (!A) { showList(); return; }
  if (q.get('print') !== null) return showPrint(A);
  showOne(A);
}
addEventListener('hashchange', route);

function showList() {
  $('#one').classList.add('hide'); $('#list').classList.remove('hide');
  $('#list').innerHTML = `<div class="note" style="margin-top:12px">Each task asks you to <b>predict</b>, then <b>measure or test something at home</b>, then <b>explain</b>. You may use AI to help you understand, but do the activity yourself: your teacher will ask about <b>your</b> numbers in class.</div>
  <div class="tasks">${ASSIGNMENTS.map(a => `<a class="task" href="#${a.id}" style="text-decoration:none"><span class="chip">Grade ${a.grade}</span><span class="chip">${a.subject}</span><b>${esc(a.title)}</b><span class="muted">${a.minutes} min · ${load(a.id)._done ? '✓ answer sheet ready' : 'not started'}</span></a>`).join('')}</div>`;
  scrollTo(0, 0);
}

function field(Q, a, locked) {
  const v = a[Q.id] ?? '', dis = locked ? 'disabled' : '';
  if (Q.type === 'number') return `<div class="numrow"><input id="q_${Q.id}" type="number" step="any" inputmode="decimal" min="${Q.min}" max="${Q.max}" value="${esc(v)}" ${dis}><span class="unit">${esc(Q.unit)}</span></div>`;
  if (Q.type === 'choice') return `<div class="opts">${Q.options.map(o => `<button type="button" class="${v === o ? 'sel' : ''}" data-q="${Q.id}" data-o="${esc(o)}" ${dis}>${esc(o)}</button>`).join('')}</div>`;
  if (Q.type === 'checks') return `<div class="checks">${Q.options.map(o => `<label><input type="checkbox" data-c="${Q.id}" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''} ${dis}> Sentence ${esc(o)}</label>`).join('')}</div>`;
  return `<textarea id="q_${Q.id}" ${dis}>${esc(v)}</textarea>`;
}

function showOne(A) {
  const a = load(A.id), locked = !!a._locked;
  $('#list').classList.add('hide'); $('#one').classList.remove('hide');
  const byPhase = p => A.questions.filter(q => q.phase === p);
  let h = `<p style="margin-top:12px"><a href="#">← All tasks</a></p>
  <section class="card"><span class="chip">Grade ${A.grade} · ${A.subject}</span><span class="chip">about ${A.minutes} min</span>
    <h2 style="margin-top:10px">${esc(A.title)}</h2><p>${esc(A.intro)}</p>
    <p class="muted">${esc(A.chapter)}</p>
    <h3>You need</h3><ul class="plain">${A.materials.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
    ${A.safety ? `<p class="msg warn">⚠ ${esc(A.safety)}</p>` : ''}
    ${A.aiText ? `<h3>What the AI said</h3><div class="ai">${A.aiText.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}
    ${A.together ? `<p class="note">👥 ${esc(A.together)}</p>` : ''}
  </section>`;
  const pq = byPhase('Predict');
  h += `<section class="card"><div class="phase">Step 1 · Predict</div>${pq.map(Q => `<div class="q"><label>${esc(Q.label)}</label>${field(Q, a, locked)}</div>`).join('')}
    ${locked ? `<span class="locked">🔒 Prediction locked</span>` : `<p class="muted">Lock your guess before you start. Being wrong is fine: that is how you learn.</p><button id="lock">Lock my prediction</button>`}</section>`;
  h += `<section class="card" style="opacity:${locked ? 1 : .5}"><div class="phase">Step 2 · Do it</div>${A.steps.map((s, i) => `<div class="step"><span class="num">${i + 1}</span><div>${esc(s)}</div></div>`).join('')}</section>`;
  h += `<section class="card" style="opacity:${locked ? 1 : .5}">`;
  let n = 3;
  for (const p of PHASES.slice(2)) {
    const qs = byPhase(p); if (!qs.length) continue;
    h += `<div class="phase">Step ${n++} · ${p}</div>` + qs.map(Q => `<div class="q"><label for="q_${Q.id}">${esc(Q.label)}</label>${field(Q, a, !locked)}</div>`).join('');
  }
  h += `<p style="margin-top:16px"><button id="check" ${locked ? '' : 'disabled'}>Check my work</button> <button class="ghost" id="sheet" ${locked ? '' : 'disabled'}>My answer sheet</button></p><div id="fb"></div></section><div id="out"></div>`;
  $('#one').innerHTML = h; scrollTo(0, 0);

  const read = () => {
    const r = { ...load(A.id) };
    for (const Q of A.questions) {
      if (Q.type === 'number') { const x = $('#q_' + Q.id).value; r[Q.id] = x === '' ? '' : Number(x); }
      else if (Q.type === 'text') r[Q.id] = $('#q_' + Q.id).value;
      else if (Q.type === 'checks') r[Q.id] = [...document.querySelectorAll(`[data-c="${Q.id}"]:checked`)].map(x => x.value);
    }
    return r;
  };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const r = read(); r[b.dataset.q] = b.dataset.o; save(A.id, r); document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x => x.classList.toggle('sel', x === b)); });
  $('#one').addEventListener('input', () => save(A.id, read()));
  if ($('#lock')) $('#lock').onclick = () => {
    const r = read();
    if (pq.some(Q => r[Q.id] === '' || r[Q.id] == null)) return alert('Make your prediction first.');
    r._locked = Date.now(); save(A.id, r); showOne(A);
  };
  $('#check').onclick = () => {
    const r = read(); save(A.id, r);
    const f = A.feedback(r), empty = A.questions.filter(Q => Q.phase !== 'Predict' && (r[Q.id] === '' || r[Q.id] == null || (Array.isArray(r[Q.id]) && !r[Q.id].length)));
    $('#fb').innerHTML = (f.length ? f : [['info', 'Fill in your measurements to get feedback.']]).map(([t, m]) => `<div class="fb ${t}">${esc(m)}</div>`).join('') +
      (empty.length ? `<div class="fb info">Still empty: ${empty.map(Q => esc(Q.label.split(/[?:.]/)[0])).join(' · ')}</div>` : '');
  };
  $('#sheet').onclick = () => { const r = read(); r._done = true; save(A.id, r); showSheet(A, r); };
}

function showSheet(A, r) {
  const val = Q => { const v = r[Q.id]; return Array.isArray(v) ? (v.length ? 'Sentences ' + v.join(', ') : '—') : (v === '' || v == null ? '—' : v + (Q.unit && Q.type === 'number' ? ' ' + Q.unit : '')); };
  $('#out').innerHTML = `<section class="card sheet"><h2>My answer sheet</h2><p class="muted">${esc(A.title)} · Grade ${A.grade} ${A.subject}${r._locked ? ' · prediction locked ' + new Date(r._locked).toLocaleString() : ''}</p>
    <dl>${A.questions.map(Q => `<dt>${esc(Q.phase)}: ${esc(Q.label)}</dt><dd>${esc(val(Q))}</dd>`).join('')}</dl>
    <p class="no-print" style="margin-top:14px"><button onclick="print()">Print or save as PDF</button> <button class="ghost" id="copy">Copy text</button></p>
    <p class="muted no-print">Copy this into your notebook, or show it to your teacher. Bring your notebook with the adult's sentence to class.</p></section>`;
  $('#copy').onclick = () => navigator.clipboard.writeText(`${A.title}\n` + A.questions.map(Q => `${Q.label}\n→ ${val(Q)}`).join('\n\n')).then(() => $('#copy').textContent = 'Copied ✓');
  $('#out').scrollIntoView({ behavior: 'smooth' });
}

// Paper worksheet for students without a device.
function showPrint(A) {
  $('#list').classList.add('hide'); $('#one').classList.remove('hide');
  const lines = Q => Q.type === 'text' ? '<div class="blank"></div><div class="blank"></div><div class="blank"></div>' : Q.type === 'number' ? `<div class="blank" style="width:200px"></div><span class="muted">${esc(Q.unit)}</span>` : `<p>${Q.options.map(o => '☐ ' + esc(Q.type === 'checks' ? 'Sentence ' + o : o)).join('&nbsp;&nbsp;&nbsp; ')}</p>`;
  $('#one').innerHTML = `<section class="card"><p class="muted">Name: ____________________ &nbsp; Class: ______ &nbsp; Roll: ______</p>
    <h2>${esc(A.title)}</h2><p>${esc(A.intro)}</p><p class="muted">Grade ${A.grade} ${A.subject} · ${esc(A.chapter)} · about ${A.minutes} min</p>
    <h3>You need</h3><p>${A.materials.map(esc).join(' · ')}</p>${A.safety ? `<p><b>Safety:</b> ${esc(A.safety)}</p>` : ''}
    ${A.aiText ? `<h3>What the AI said</h3>${A.aiText.map(t => `<p>${esc(t)}</p>`).join('')}` : ''}
    <h3>Steps</h3><ol>${A.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${A.together ? `<p><i>${esc(A.together)}</i></p>` : ''}
    ${A.questions.map(Q => `<div class="q"><b>${esc(Q.phase)}:</b> ${esc(Q.label)}${lines(Q)}</div>`).join('')}
    <p class="no-print"><button onclick="print()">Print</button></p></section>`;
}
route();
</script>
</body>
</html>
