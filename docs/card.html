<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result Card</title>
<meta name="description" content="A signed result card for a Measure It homework task. Teachers can check a code here.">
<link rel="stylesheet" href="style.css">
<style>
.big{font-size:34px;font-weight:800}
.lv{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:700}
.lv.got_it{background:var(--ok-bg);color:var(--ok)} .lv.partly{background:var(--warn-bg);color:var(--warn)} .lv.not_yet{background:var(--chip);color:var(--ink-2)}
.code{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <h1 class="no-print">Result card</h1>
  <p class="muted no-print">Students: this is the card for your teacher. Teachers: paste a code below to check it is genuine. No login.</p>
  <form id="f" class="row no-print" style="margin:12px 0"><div><label for="code">Code</label><input id="code" autocomplete="off" placeholder="e.g. PEN-GC-261014-GPGP-4KQ7-ABCD2345"></div><div style="flex:0 0 auto"><button type="submit">Check code</button></div></form>
  <div id="out"></div>
  <p class="muted no-print" style="margin-top:20px"><a href="./">Student page</a> · <a href="teacher.html">Teacher page</a></p>
</main>
<script src="api.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function show(code) {
  code = code.trim(); if (!code) return;
  $('#code').value = code;
  $('#out').innerHTML = '<p class="muted">Checking…</p>';
  try {
    const r = await (await fetch(API + '/api/check?code=' + encodeURIComponent(code))).json();
    if (!r.ok) { $('#out').innerHTML = `<div class="msg warn"><b>Not a valid code.</b> ${esc(r.error || '')}</div>`; return; }
    $('#out').innerHTML = `<section class="card">
      <p class="muted">${esc(r.title)} · Grade ${r.grade} ${esc(r.subject)} · ${esc(r.date)}</p>
      <p class="big"><span class="lv ${r.level}">${esc(LEVEL_TEXT[r.level])}</span></p>
      <p>${r.numbers === 'consistent' ? 'The measurements agree with each other.' : '<b>The measurements did not fully agree with each other.</b>'}</p>
      <div class="tw"><table>${r.questions.map(q => `<tr><td>${esc(q.label)}</td><td><span class="lv ${q.level}">${esc(LEVEL_TEXT[q.level])}</span></td></tr>`).join('')}</table></div>
      <p style="margin-top:12px">Code: <span class="code">${esc(code.toUpperCase())}</span></p>
      <p class="muted">Student name (write by hand): ______________________ &nbsp; Class: ______</p>
      <p class="muted">This card says the written answers met the task’s rubric and the numbers were consistent. It does not prove the activity was done. The code is signed, so the level cannot be changed.</p>
      <p class="no-print"><button onclick="print()">Print</button></p></section>`;
  } catch (e) { $('#out').innerHTML = '<div class="msg warn">Could not reach the checker. Try again later.</div>'; }
}
$('#f').onsubmit = e => { e.preventDefault(); history.replaceState(null, '', '#' + encodeURIComponent($('#code').value.trim())); show($('#code').value); };
if (location.hash.length > 1) show(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
